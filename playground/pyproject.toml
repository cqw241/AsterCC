[project]
name = "astercc-playground"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1"]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "pytest>=8,<10",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = [".."]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
